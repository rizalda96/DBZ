[package]
name = "dbz"
version = "1.0.1"
edition = "2021"
description = "Desktop database manager for MySQL, MariaDB, PostgreSQL and SQL Server"
authors = ["rizalda96"]
homepage = "https://github.com/rizalda96/DBZ"

# Installers: `cargo packager --release` after `cargo build --release` (the release
# workflow in .github/workflows/release.yml does both on each OS). Output goes to dist/.
[package.metadata.packager]
product-name = "DBZ"
identifier = "com.rizalda96.dbz"
out-dir = "dist"
category = "DeveloperTool"
icons = ["assets/logo/icon.png", "assets/logo/icon.ico"]

# What the window needs at run time, and the file dialogs' portal.
[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libgl1", "libwayland-client0", "libx11-6", "xdg-desktop-portal"]

[dependencies]
# `wayland` and `x11` are the Linux window backends (ignored on Windows and macOS).
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.37", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }
postgres = { version = "0.19" }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQL Server. tiberius is async; the driver runs it on its own single-thread tokio
# runtime, so the rest of the app stays on plain worker threads. TLS comes from the
# OS (SChannel on Windows, Security.framework on macOS, OpenSSL on Linux), and
# sql-browser-tokio resolves named instances such as `host\SQLEXPRESS`.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "sql-browser-tokio"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = { version = "0.3", default-features = false }
# Microsoft Entra sign-in for SQL Server: the token requests go over HTTPS with the
# same OS TLS as tiberius, and the browser sign-in uses PKCE (sha2 + base64 + getrandom,
# all already built for the other drivers).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# Importing connections from other tools: Navicat keeps passwords with Blowfish (key =
# SHA-1 of a fixed string) or AES, DBeaver with AES.
aes = "0.8"
aes-gcm = "0.10"
blowfish = "0.9"
sha1 = "0.10"

# Windows Authentication to SQL Server through SSPI, and reading Navicat's newer
# passwords (its key lives in Windows Credential Manager).
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# Builds OpenSSL into the Linux binary, so the .deb and the AppImage don't depend on
# the libssl version a distribution ships.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

# The GNU Rust toolchain on this machine has no assembler for `dlltool`, which the
# upstream `windows-link` needs. This local copy links against the bundled import
# library instead. Safe to remove on machines with Visual Studio build tools.
[patch.crates-io]
windows-link = { path = "patches/windows-link" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = true
